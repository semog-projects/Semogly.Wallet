include: package:flutter_lints/flutter.yaml

analyzer:
  # Clientes e models gerados a partir do OpenAPI (swagger_parser + build_runner)
  exclude:
    - lib/core/api/generated/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
